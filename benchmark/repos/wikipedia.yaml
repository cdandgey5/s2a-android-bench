# Wikipedia Android app - repo #2 (Kotlin, single app module, Apache-2.0)
key: wikipedia
display_name: Wikipedia Android
url: https://github.com/wikimedia/apps-android-wikipedia
license: Apache-2.0
default_branch: main
language: kotlin
ui: xml                                      # TODO: check for Compose usage; set mixed if both
structure: single_module

toolchain:
  jdk: 17                                    # TODO verify  # resolved to ABB_HOME\tools\jdk17
  android:
    packages:
      - "platforms;android-35"
      - "build-tools;35.0.0"
  gradle_user_home_props: |
    org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    kotlin.daemon.jvmargs=-Xmx2g
    kotlin.compiler.execution.strategy=in-process   # no shared Kotlin daemon between trials
    org.gradle.parallel=false
    org.gradle.caching=false   # a build cache would carry compiled classes of later commits into workspaces
    org.gradle.configuration-cache=false
    org.gradle.warning.mode=none

build:
  cache_commit: TODO_40_CHAR_SHA
  setup_commit: TODO_40_CHAR_SHA            # git merge-base --octopus of this repo's task base commits (specs/repo-config.md)
  warm_commands:                             # TODO: flavors (e.g. prod/dev/alpha/beta/fdroid) -> pick the one CI tests
    - cmd: "{gradlew} --console=plain --no-daemon :app:assembleProdDebug"
    - cmd: "{gradlew} --console=plain --no-daemon :app:testProdDebugUnitTest"
      allow_failure: true
  stubs: []                                  # TODO: check whether repo.keystore/repo.properties are needed for debug builds
  env:
    JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

tests:
  test_task_for_module:
    default: "testProdDebugUnitTest"         # TODO confirm
  junit_dir: "build/test-results"
  verify_modules: [":TODO_LIB_MODULE", ":app"]   # used by `abb env verify`; one library module + the app module
  test_dirs:
    - "**/src/test/**"
    - "**/src/androidTest/**"
    - "**/src/sharedTest/**"
    - "**/src/testFixtures/**"
  protected_build_paths:              # restored from base at grading unless gold.patch touches the file (specs/grading-protocol.md)
    - "gradlew"
    - "gradlew.bat"
    - "gradle/**"
    - "buildSrc/**"
    - "build-logic/**"
    - "**/*.init.gradle*"
  build_config_files:                 # ALSO protected; listed separately because the test_config_suspect scan applies to them
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "settings.gradle"
    - "settings.gradle.kts"
    - "gradle.properties"
    - "gradle/libs.versions.toml"

workspace:
  exclude_from_snapshot:
    - ".git"
    - ".github"
    - ".idea"
  strip_agent_instructions: false
  diff_exclude:
    - ".claude/**"
    - ".specify/**"
    - "specs/**"
    - ".s2a/**"
    - "CLAUDE.md"
    - "AGENTS.md"
    - "**/build/**"
    - ".gradle/**"
    - ".idea/**"
    - "*.log"

lint:
  command: null
  report_glob: null
