[project]
name = "s2a"
version = "0.1.0"
description = "S2A (Specs -> App): an orchestrator that drives a coding agent through a brownfield change end to end"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
s2a = "s2a.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s2a"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
python-preference = "only-managed"   # never the Microsoft Store Python (virtualized AppData)
