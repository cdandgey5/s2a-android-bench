# Wikipedia Android app - repo #2 (Kotlin, Apache-2.0). Values from the Phase 0 experiment (2026-10-17,
# reference/build-experiments.md).
key: wikipedia
display_name: Wikipedia Android
url: https://github.com/wikimedia/apps-android-wikipedia
license: Apache-2.0
default_branch: main
language: kotlin
ui: mixed                                    # XML layouts + Compose (123 files with @Composable in app/src/main, 2026-10-17)
structure: single_module                     # one app module (+ the small :analytics:testkitchen library)

toolchain:
  jdk: 17                                    # JavaVersion.VERSION_17 / JvmTarget.JVM_17; CI java-version 17 (ABB_HOME\tools\jdk17)
  android:
    packages:                                # resolved by AGP in the Phase 0 build (compileSdk 37)
      - "platforms;android-37.0"
      - "build-tools;36.0.0"
  gradle_user_home_props: |
    org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    kotlin.daemon.jvmargs=-Xmx2g
    kotlin.compiler.execution.strategy=in-process   # no shared Kotlin daemon between trials
    org.gradle.parallel=false
    org.gradle.caching=false   # a build cache would carry compiled classes of later commits into workspaces
    org.gradle.configuration-cache=false
    org.gradle.warning.mode=none

build:
  cache_commit: 0c7ee9b4682512217e01d829fb0b6d068d268724   # main on 2026-10-17: the Phase 0 experiment
  setup_commit: 0c7ee9b4682512217e01d829fb0b6d068d268724   # no tasks yet: = cache_commit until `abb tasks coverage` sets the octopus merge-base
  warm_commands:                             # flavors alpha/beta/custom/dev/fdroid/prod; CI tests `testAlphaDebugUnitTest`
    - cmd: "{gradlew} --console=plain --no-daemon :app:assembleAlphaDebug"
    - cmd: "{gradlew} --console=plain --no-daemon testAlphaDebugUnitTest"
      allow_failure: true
    - cmd: "{gradlew} --console=plain --no-daemon --continue test assembleDebug"   # D-044: every variant an agent may build
      allow_failure: true
      no_test_execution: true
  stubs: []                                  # app/google-services.json, repo.keystore, repo.properties are tracked upstream: nothing to stub
  env:
    JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

tests:
  test_task_for_module:
    default: "testAlphaDebugUnitTest"        # the variant CI tests (.github/workflows/android_pr.yml); both modules have the flavors
  junit_dir: "build/test-results"
  verify_modules: [":analytics:testkitchen", ":app"]   # used by `abb env verify`: the one library module + the app module
  test_dirs:
    - "**/src/test/**"
    - "**/src/androidTest/**"
    - "**/src/sharedTest/**"
    - "**/src/testFixtures/**"
  protected_build_paths:              # restored from base at grading unless gold.patch touches the file (specs/grading-protocol.md)
    - "gradlew"
    - "gradlew.bat"
    - "gradle/**"
    - "buildSrc/**"
    - "build-logic/**"
    - "**/*.init.gradle*"
  build_config_files:                 # ALSO protected; listed separately because the test_config_suspect scan applies to them
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "settings.gradle"
    - "settings.gradle.kts"
    - "gradle.properties"
    - "gradle/libs.versions.toml"

workspace:
  exclude_from_snapshot:
    - ".git"
    - ".github"
    - ".idea"
  strip_agent_instructions: false            # repo ships CLAUDE.md + AGENTS.md; keep (D-004)
  diff_exclude:
    - ".claude/**"
    - ".specify/**"
    - "specs/**"
    - ".s2a/**"
    - "CLAUDE.md"
    - "AGENTS.md"
    - "**/build/**"
    - ".gradle/**"
    - ".idea/**"
    - "*.log"

lint:
  command: null
  report_glob: null
