# AntennaPod - repo #1 (Java/XML, multi-module, GPL-3.0)
# Values discovered in the Phase 0 experiment (2026-10-17, reference/build-experiments.md).
key: antennapod
display_name: AntennaPod
url: https://github.com/AntennaPod/AntennaPod
license: GPL-3.0
default_branch: develop
language: java
ui: xml
structure: multi_module

toolchain:
  jdk: 21                                   # common.gradle sourceCompatibility VERSION_21; CI java-version 21 (ABB_HOME\tools\jdk21)
  android:
    packages:                               # resolved by AGP in the Phase 0 build (compileSdk 36)
      - "platforms;android-36"
      - "build-tools;36.0.0"
  gradle_user_home_props: |
    org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    kotlin.daemon.jvmargs=-Xmx2g
    kotlin.compiler.execution.strategy=in-process   # no shared Kotlin daemon between trials
    org.gradle.parallel=false
    org.gradle.caching=false   # a build cache would carry compiled classes of later commits into workspaces
    org.gradle.configuration-cache=false
    org.gradle.warning.mode=none

build:
  cache_commit: 3d105d598dfa582c6cb22ba40b56d11780366890   # develop on 2026-10-17 (commit date 2026-10-11): the Phase 0 experiment
  setup_commit: d05a58b47643592e968e9d1ed55736cc822ac8f2   # git merge-base --octopus of the dev5 base commits (2026-10-18); `abb tasks coverage` re-sets it
  warm_commands:                            # free flavor (F-Droid build, no Play services); root selectors cover every module
    - cmd: "{gradlew} --console=plain --no-daemon assembleFreeDebug"
    - cmd: "{gradlew} --console=plain --no-daemon testFreeDebugUnitTest testDebugUnitTest"
      allow_failure: true
    - cmd: "{gradlew} --console=plain --no-daemon --continue test assembleDebug"   # D-044: every variant an agent may build (play too)
      allow_failure: true
      no_test_execution: true
  stubs: []                                 # nothing to stub: builds and tests ran without secrets (Phase 0)
  env:
    JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

tests:
  test_task_for_module:
    default: "testDebugUnitTest"            # library modules without product flavors
    # modules with free/play flavors (`gradlew tasks --all`, 2026-10-17)
    ":app": "testFreeDebugUnitTest"
    ":app-wearos": "testFreeDebugUnitTest"
    ":net:common": "testFreeDebugUnitTest"
    ":net:discovery": "testFreeDebugUnitTest"
    ":net:download:service": "testFreeDebugUnitTest"
    ":net:download:service-interface": "testFreeDebugUnitTest"
    ":net:ssl": "testFreeDebugUnitTest"
    ":net:sync:service": "testFreeDebugUnitTest"
    ":playback:base": "testFreeDebugUnitTest"
    ":playback:cast": "testFreeDebugUnitTest"
    ":playback:service": "testFreeDebugUnitTest"
    ":storage:database": "testFreeDebugUnitTest"
    ":storage:database-maintenance-service": "testFreeDebugUnitTest"
    ":storage:importexport": "testFreeDebugUnitTest"
    ":ui:chapters": "testFreeDebugUnitTest"
    ":ui:discovery": "testFreeDebugUnitTest"
    ":ui:echo": "testFreeDebugUnitTest"
    ":ui:glide": "testFreeDebugUnitTest"
    ":ui:preferences": "testFreeDebugUnitTest"
    ":ui:statistics": "testFreeDebugUnitTest"
    ":ui:transcript": "testFreeDebugUnitTest"
    ":ui:widget": "testFreeDebugUnitTest"
  junit_dir: "build/test-results"
  verify_modules: [":parser:feed", ":app"]  # used by `abb env verify`: one library module (the seed task's) + the app module
  test_dirs:
    - "**/src/test/**"
    - "**/src/testDebug/**"
    - "**/src/testFree/**"
    - "**/src/testPlay/**"
    - "**/src/androidTest/**"
    - "**/src/sharedTest/**"
    - "**/src/testFixtures/**"
  protected_build_paths:              # restored from base at grading unless gold.patch touches the file (specs/grading-protocol.md)
    - "gradlew"
    - "gradlew.bat"
    - "gradle/**"
    - "buildSrc/**"
    - "build-logic/**"
    - "**/*.init.gradle*"
  build_config_files:                 # ALSO protected; listed separately because the test_config_suspect scan applies to them
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "settings.gradle"
    - "common.gradle"
    - "playFlavor.gradle"
    - "mockitoAgent.gradle"
    - "gradle.properties"
    - "gradle/libs.versions.toml"

workspace:
  exclude_from_snapshot:
    - ".git"
    - ".github"
    - ".idea"
    - "store-metadata"
  strip_agent_instructions: false           # repo ships CLAUDE.md + AGENTS.md; keep (D-004)
  diff_exclude:
    - ".claude/**"
    - ".specify/**"
    - "specs/**"
    - ".s2a/**"
    - "CLAUDE.md"
    - "AGENTS.md"
    - "**/build/**"
    - ".gradle/**"
    - ".idea/**"
    - "*.log"

lint:
  command: null                              # set in Phase 3 step 7 if lint is fast enough
  report_glob: null
