# abb-proxy: allow-list egress for agent containers (only CONNECTs to api.anthropic.com:443).
# Deliberately NO `Allow`/`Deny` lines: with none present, tinyproxy accepts every client, which
# is what we want on the internal `abb-agent` network (the stock conf's `Allow 127.0.0.1` would
# reject every container). Build: benchmark/docker/proxy/Dockerfile (Phase 1 step 9).
User nobody
Group nogroup
Port 8888
Timeout 600
LogLevel Info
MaxClients 64
ConnectPort 443
DisableViaHeader Yes
FilterDefaultDeny Yes
FilterType ere
Filter "/etc/tinyproxy/allow"
