# `abb run --dry-run`: mean est. USD per trial per arm, per model (Claude Code's client-side estimate; no bill
# under the subscription). From valid dev runs (docs/RUNS.md); update when new runs change them. An arm with no
# number here is listed under `unknown_arms` and left out of the estimate.
models:
  claude-sonnet-5-5:
    per_trial_usd:
      plain: 0.20            # 20261018-0429-dev5-plain-1, -0456-dev5-plain-2
      plain-guided: 0.22     # 20261018-1010-dev5-guided-1
      speckit: 0.72          # 20261019-0112-dev5-speckit-2
      s2a: 1.18              # 20261019-1112-dev5-s2a-2
      s2a-nomap: 0.85
      s2a-noverify: 0.81
  claude-opus-5-5:
    per_trial_usd:           # 20261022-0355-dev-opus-confirm (dev x 1, report/tables/headline.csv cost_mean)
      plain: 0.5118
      plain-guided: 0.6144
      speckit: 2.2602
      s2a: 3.5134
      s2a-nomap: 3.1124
      s2a-noverify: 2.9369
      # optional arms (1 trial; never run on Opus): conservative stand-ins, not measurements
      plain-gate: 0.6144     # = plain-guided (on Sonnet plain-gate cost 0.93 x plain-guided, dev-baseline-1)
      s2a-norepro: 3.5134    # = s2a (it skips one stage)
      speckit-sdd: 3.5468    # mean of this run's speckit trials that took the SDD path (n = 5)
