# Container network modes (see specs/docker-images.md, "Network policy").
modes:
  none:                 # validation, grading, image verification
    docker_network: none

  api-only:             # agent runs. REQUIRED for every arm; not a stretch goal (D-009).
    # An internal network with no route to the outside; the only way out is the proxy sidecar,
    # which allows CONNECTs to api.anthropic.com and nothing else. With Bash available to the
    # agent, a tool deny list alone cannot stop `git clone`/`curl` of the upstream fix.
    docker_network: abb-agent            # created with: docker network create --internal abb-agent
    proxy:
      container: abb-proxy               # built from docker/proxy/ (tinyproxy), attached to abb-agent AND bridge
      url: http://abb-proxy:8888
      allow_hosts: ["api.anthropic.com"]
    env:
      HTTPS_PROXY: http://abb-proxy:8888
      HTTP_PROXY: http://abb-proxy:8888
      NO_PROXY: localhost,127.0.0.1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"   # also baked into the image; no telemetry/version checks to retry against the proxy
      CLAUDE_CODE_PROXY_RESOLVES_HOSTS: "1"           # the internal network has no DNS route; the proxy resolves api.anthropic.com
    disallowed_tools: ["WebFetch", "WebSearch"]   # belt and braces; the proxy is the real guard

  open:                 # image builds, and a DEV-ONLY debugging escape hatch (`abb run --network open`):
    docker_network: bridge   # recorded in the manifest; refused for --tasks test

container:
  memory: "8g"
  memory_swap: "8g"
  cpus: 4
  env:
    CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "60000"
