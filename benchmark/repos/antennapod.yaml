# AntennaPod - repo #1 (Java/XML, multi-module, GPL-3.0)
# Values marked TODO are discovered in Phase 0 step 7 and filled in Phase 0 step 8.
key: antennapod
display_name: AntennaPod
url: https://github.com/AntennaPod/AntennaPod
license: GPL-3.0
default_branch: develop
language: java
ui: xml
structure: multi_module

toolchain:
  jdk: 17                                   # TODO verify (gradle/libs.versions.toml or CI workflow)  # resolved to ABB_HOME\tools\jdk17
  android:
    packages:                               # TODO replace with `sdkmanager --list_installed` after a full build
      - "platforms;android-35"
      - "build-tools;35.0.0"
  gradle_user_home_props: |
    org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    kotlin.daemon.jvmargs=-Xmx2g
    kotlin.compiler.execution.strategy=in-process   # no shared Kotlin daemon between trials
    org.gradle.parallel=false
    org.gradle.caching=false   # a build cache would carry compiled classes of later commits into workspaces
    org.gradle.configuration-cache=false
    org.gradle.warning.mode=none

build:
  cache_commit: TODO_40_CHAR_SHA            # the develop commit used in the Phase 0 experiment
  setup_commit: TODO_40_CHAR_SHA            # git merge-base --octopus of this repo's task base commits (specs/repo-config.md)
  warm_commands:                            # TODO confirm task names (app module has flavors: free/play)
    - cmd: "{gradlew} --console=plain --no-daemon assembleFreeDebug"
    - cmd: "{gradlew} --console=plain --no-daemon testFreeDebugUnitTest testDebugUnitTest"
      allow_failure: true
  stubs: []
  env:
    JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

tests:
  test_task_for_module:
    default: "testDebugUnitTest"            # library modules
    ":app": "testFreeDebugUnitTest"         # TODO confirm
  junit_dir: "build/test-results"
  verify_modules: [":TODO_LIB_MODULE", ":app"]   # used by `abb env verify`; one library module + the app module
  test_dirs:
    - "**/src/test/**"
    - "**/src/testDebug/**"
    - "**/src/testFree/**"
    - "**/src/testPlay/**"
    - "**/src/androidTest/**"
    - "**/src/sharedTest/**"
    - "**/src/testFixtures/**"
  protected_build_paths:              # restored from base at grading unless gold.patch touches the file (specs/grading-protocol.md)
    - "gradlew"
    - "gradlew.bat"
    - "gradle/**"
    - "buildSrc/**"
    - "build-logic/**"
    - "**/*.init.gradle*"
  build_config_files:                 # ALSO protected; listed separately because the test_config_suspect scan applies to them
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "settings.gradle"
    - "common.gradle"
    - "playFlavor.gradle"
    - "mockitoAgent.gradle"
    - "gradle.properties"
    - "gradle/libs.versions.toml"

workspace:
  exclude_from_snapshot:
    - ".git"
    - ".github"
    - ".idea"
    - "store-metadata"
  strip_agent_instructions: false           # repo ships CLAUDE.md + AGENTS.md; keep (D-004)
  diff_exclude:
    - ".claude/**"
    - ".specify/**"
    - "specs/**"
    - ".s2a/**"
    - "CLAUDE.md"
    - "AGENTS.md"
    - "**/build/**"
    - ".gradle/**"
    - ".idea/**"
    - "*.log"

lint:
  command: null                              # set in Phase 3 step 7 if lint is fast enough
  report_glob: null
