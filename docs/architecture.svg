<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>abb architecture: harness, sandboxed arms, grading, audit and report</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#444;stroke-width:1.2}
      .zone{fill:#f3f5f8;stroke:#9aa5b1;stroke-dasharray:5 4}
      .sand{fill:#fff7e8;stroke:#c08a2e;stroke-dasharray:5 4}
      .hid{fill:#fdeeee;stroke:#b5484b}
      .t{font-weight:600}
      .s{fill:#555;font-size:11.5px}
      .l{stroke:#444;stroke-width:1.2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>

  <!-- harness zone -->
  <rect class="zone" x="20" y="20" width="400" height="600" rx="10"/>
  <text x="36" y="44" class="t">Harness — benchmark/ (abb, Python 3.12)</text>
  <text x="36" y="61" class="s">runs as the owner; the only place that sees hidden tests</text>

  <rect class="box" x="40" y="80" width="360" height="62" rx="6"/>
  <text x="54" y="102" class="t">abb run · Runner + Scheduler</text>
  <text x="54" y="120" class="s">arms × tasks × trials, trial-major; 2 workers (one slot user each);</text>
  <text x="54" y="135" class="s">budget stop; pause at five-hour ≥ 0.9, probe, resume; freeze gate</text>

  <rect class="box" x="40" y="160" width="170" height="70" rx="6"/>
  <text x="54" y="182" class="t">Setup cache</text>
  <text x="54" y="200" class="s">constitution / map, once</text>
  <text x="54" y="215" class="s">per repo × model (D-058)</text>

  <rect class="box" x="230" y="160" width="170" height="70" rx="6"/>
  <text x="244" y="182" class="t">Platform layer</text>
  <text x="244" y="200" class="s">launcher, Job Objects,</text>
  <text x="244" y="215" class="s">ACLs, Ctrl+C (windows.py)</text>

  <rect class="hid" x="40" y="252" width="360" height="74" rx="6"/>
  <text x="54" y="272" class="t">Grader (after the agent ends)</text>
  <text x="54" y="289" class="s">fresh snapshot + agent diff + hidden test.patch → Gradle offline;</text>
  <text x="54" y="303" class="s">fail-to-pass and pass-to-pass (flaky re-run) → grade.json.</text>
  <text x="54" y="317" class="s">The agent gets problem.md only, never test.patch or gold.patch.</text>

  <rect class="box" x="40" y="346" width="360" height="74" rx="6"/>
  <text x="54" y="368" class="t">Records — results/&lt;run_id&gt;/</text>
  <text x="54" y="386" class="s">transcripts verbatim (the truth) → run.json, calls.jsonl derived</text>
  <text x="54" y="401" class="s">manifest: versions, fingerprints, PREREG sha256, resumes</text>
  <text x="54" y="414" class="s">cut, invalidated, failed-setup records kept, never dropped</text>

  <rect class="box" x="40" y="440" width="170" height="80" rx="6"/>
  <text x="54" y="462" class="t">abb audit</text>
  <text x="54" y="480" class="s">recomputes run.json from</text>
  <text x="54" y="495" class="s">transcripts; token-leak scan</text>
  <text x="54" y="510" class="s">report withheld if it fails</text>

  <rect class="box" x="230" y="440" width="170" height="80" rx="6"/>
  <text x="244" y="462" class="t">abb report · repro</text>
  <text x="244" y="480" class="s">pass@1, pass^k, paired</text>
  <text x="244" y="495" class="s">bootstrap CIs, cost, setup;</text>
  <text x="244" y="510" class="s">deterministic, re-checkable</text>

  <rect class="box" x="40" y="540" width="360" height="62" rx="6"/>
  <text x="54" y="562" class="t">docs/PREREG.md · tag v1.0-frozen</text>
  <text x="54" y="580" class="s">primary comparison, exclusion and rerun rules fixed before the</text>
  <text x="54" y="595" class="s">single held-out run; test ids refused while tuning (ABB_TUNING=1)</text>

  <!-- sandbox zone -->
  <rect class="sand" x="460" y="20" width="480" height="440" rx="10"/>
  <text x="476" y="44" class="t">Sandbox — Windows users abb-agent, abb-agent2</text>
  <text x="476" y="61" class="s">low privilege; own HOME; ACLs to its trial dir only; token via env block</text>

  <rect class="box" x="480" y="80" width="440" height="58" rx="6"/>
  <text x="494" y="102" class="t">Trial workspace</text>
  <text x="494" y="120" class="s">history-free snapshot at the task's base commit (one "base" commit, no</text>
  <text x="494" y="133" class="s">remote) + cached setup artifacts; no hidden tests, no gold patch</text>

  <rect class="box" x="480" y="156" width="135" height="104" rx="6"/>
  <text x="494" y="178" class="t">plain arms</text>
  <text x="494" y="196" class="s">plain</text>
  <text x="494" y="211" class="s">plain-guided</text>
  <text x="494" y="226" class="s">plain-gate</text>
  <text x="494" y="245" class="s">one call</text>

  <rect class="box" x="632" y="156" width="135" height="104" rx="6"/>
  <text x="646" y="178" class="t">speckit</text>
  <text x="646" y="196" class="s">bug path or SDD</text>
  <text x="646" y="211" class="s">(specify → plan →</text>
  <text x="646" y="226" class="s">tasks → implement)</text>
  <text x="646" y="245" class="s">Spec Kit v1.2.1</text>

  <rect class="box" x="784" y="156" width="136" height="104" rx="6"/>
  <text x="798" y="178" class="t">s2a (CLI only)</text>
  <text x="798" y="196" class="s">map · intake · locate</text>
  <text x="798" y="211" class="s">spec · plan · impl.</text>
  <text x="798" y="226" class="s">reproduce · verify/fix</text>
  <text x="798" y="245" class="s">own gates (Gradle)</text>

  <rect class="box" x="480" y="280" width="440" height="58" rx="6"/>
  <text x="494" y="302" class="t">claude.exe 2.1.302 (pinned copy) · claude-opus-5-5</text>
  <text x="494" y="320" class="s">headless -p, stream-json; same budget per trial: 45 min, $15 est., 200 turns,</text>
  <text x="494" y="333" class="s">nudges ≤ 2/call, ≤ 4/trial; WebFetch/WebSearch disallowed</text>

  <rect class="box" x="480" y="358" width="440" height="80" rx="6"/>
  <text x="494" y="380" class="t">Egress proxy (harness-owned)</text>
  <text x="494" y="398" class="s">allows api.anthropic.com only; the rest is refused and logged:</text>
  <text x="494" y="413" class="s">no web, no upstream PRs, no downloads. Gradle runs offline from</text>
  <text x="494" y="428" class="s">read-only caches warmed per base commit.</text>

  <rect class="box" x="460" y="480" width="480" height="122" rx="10"/>
  <text x="476" y="504" class="t">s2a/ — the orchestrator (separate package)</text>
  <text x="476" y="524" class="s">never imports the benchmark, and the benchmark never imports it: the only</text>
  <text x="476" y="539" class="s">contract is the headless-driving spec + shared transcript fixtures.</text>
  <text x="476" y="554" class="s">Nothing in s2a/ mentions hidden tests, grading or task ids; it behaves the</text>
  <text x="476" y="569" class="s">same with or without a benchmark watching. Installed into the sandbox</text>
  <text x="476" y="584" class="s">at a recorded sha (frozen 5ca7283).</text>

  <!-- arrows -->
  <path class="l" d="M400,111 L478,111"/>
  <text x="410" y="104" class="s">snapshot</text>
  <path class="l" d="M125,160 L125,151 L440,151 L440,130 L478,130"/>
  <path class="l" d="M547,260 L547,278"/>
  <path class="l" d="M699,260 L699,278"/>
  <path class="l" d="M852,260 L852,278"/>
  <path class="l" d="M700,338 L700,356"/>
  <path class="l" d="M480,320 C440,330 430,300 402,290"/>
  <text x="414" y="342" class="s">diff</text>
  <path class="l" d="M220,326 L220,344"/>
  <path class="l" d="M125,420 L125,438"/>
  <path class="l" d="M315,420 L315,438"/>
  <path class="l" d="M210,480 L228,480"/>
  <path class="l" d="M930,480 L930,208 L922,208"/>
  <text x="884" y="472" class="s">install</text>
</svg>
