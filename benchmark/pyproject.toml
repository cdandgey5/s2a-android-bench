[project]
name = "abb"
version = "0.1.0"
description = "Android Brownfield Bench - harness for the S2A brownfield Android agent benchmark"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
    "docker>=7",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
abb = "abb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker and built images (set ABB_INTEGRATION=1)"]
