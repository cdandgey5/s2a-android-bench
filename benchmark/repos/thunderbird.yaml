# Thunderbird for Android (K-9 Mail) - repo #3 candidate (Kotlin/Compose, multi-module, Apache-2.0, JDK 21)
key: thunderbird
display_name: Thunderbird for Android
url: https://github.com/thunderbird/thunderbird-android
license: Apache-2.0
default_branch: main
language: kotlin
ui: mixed                                    # Compose in feature modules, legacy XML in legacy/
structure: multi_module

toolchain:
  jdk: 21                                    # from .java-version (verified 2026-10-16)  # resolved to ABB_HOME\tools\jdk21
  android:
    packages:
      - "platforms;android-35"
      - "build-tools;35.0.0"
  gradle_user_home_props: |
    org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    kotlin.daemon.jvmargs=-Xmx3g
    kotlin.compiler.execution.strategy=in-process   # no shared Kotlin daemon between trials
    org.gradle.parallel=false
    org.gradle.caching=false   # a build cache would carry compiled classes of later commits into workspaces
    org.gradle.configuration-cache=false
    org.gradle.warning.mode=none

build:
  cache_commit: TODO_40_CHAR_SHA
  setup_commit: TODO_40_CHAR_SHA            # git merge-base --octopus of this repo's task base commits (specs/repo-config.md)
  warm_commands:                             # TODO: the repo is large; warm the modules tasks will touch (core, mail, feature/*), not everything
    - cmd: "{gradlew} --console=plain --no-daemon :app-k9mail:assembleDebug"
    - cmd: "{gradlew} --console=plain --no-daemon testDebugUnitTest"
      allow_failure: true
  stubs: []                                  # OAuth config only matters for shipping forks; unit tests should not need it (verify)
  env:
    JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

tests:
  test_task_for_module:
    default: "testDebugUnitTest"             # TODO confirm; JVM-only modules may use plain `test`
  junit_dir: "build/test-results"
  verify_modules: [":TODO_LIB_MODULE", ":app"]   # used by `abb env verify`; one library module + the app module
  test_dirs:
    - "**/src/test/**"
    - "**/src/androidTest/**"
    - "**/src/sharedTest/**"
    - "**/src/testFixtures/**"
    - "**/src/screenshotTest/**"
  protected_build_paths:              # restored from base at grading unless gold.patch touches the file (specs/grading-protocol.md)
    - "gradlew"
    - "gradlew.bat"
    - "gradle/**"
    - "buildSrc/**"
    - "build-logic/**"
    - "**/*.init.gradle*"
  build_config_files:                 # ALSO protected; listed separately because the test_config_suspect scan applies to them
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "settings.gradle.kts"
    - "gradle.properties"
    - "gradle/libs.versions.toml"
    - "build-plugin/**"

workspace:
  exclude_from_snapshot:
    - ".git"
    - ".github"
    - ".idea"
    - "docs"
  strip_agent_instructions: false
  diff_exclude:
    - ".claude/**"
    - ".specify/**"
    - "specs/**"
    - ".s2a/**"
    - "CLAUDE.md"
    - "AGENTS.md"
    - "**/build/**"
    - ".gradle/**"
    - ".idea/**"
    - "*.log"

lint:
  command: null
  report_glob: null
